<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Learnio - Memory Game</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Arial,Helvetica,sans-serif;
height:100vh;
overflow:hidden;

background:linear-gradient(
180deg,
#7dd3fc,
#dbeafe,
#fef9c3
);

display:flex;
justify-content:center;
align-items:center;

}

/*==========================
TOP BAR
==========================*/

.topBar{

position:absolute;

top:15px;

left:50%;

transform:translateX(-50%);

width:min(95%,900px);

display:flex;

justify-content:space-between;

padding:12px 20px;

border-radius:20px;

background:rgba(255,255,255,.35);

backdrop-filter:blur(15px);

box-shadow:0 10px 25px rgba(0,0,0,.15);

}

.stat{

text-align:center;

}

.label{

font-size:13px;

color:#666;

}

.value{

font-size:22px;

font-weight:bold;

color:#1e3a8a;

}

/*==========================
GAME BOARD
==========================*/

#gameBoard{

display:grid;

grid-template-columns:repeat(4,90px);

gap:15px;

}

/*==========================
CARD
==========================*/

.card{

width:90px;

height:90px;

cursor:pointer;

position:relative;

transform-style:preserve-3d;

transition:.45s;

}

.card.flip{

transform:rotateY(180deg);

}

.front,
.back{

position:absolute;

inset:0;

border-radius:18px;

display:flex;

justify-content:center;

align-items:center;

font-size:42px;

backface-visibility:hidden;

}

.front{

background:#ffffff;

box-shadow:0 5px 15px rgba(0,0,0,.15);

}

.back{

background:#4f46e5;

color:white;

transform:rotateY(180deg);

}

/*==========================
START SCREEN
==========================*/

.screen{

position:absolute;

inset:0;

display:flex;

justify-content:center;

align-items:center;

background:rgba(0,0,0,.25);

z-index:2000;

}

.box{

background:white;

padding:35px;

border-radius:25px;

width:min(92%,420px);

text-align:center;

box-shadow:0 20px 40px rgba(0,0,0,.2);

}

.box h1{

color:#4f46e5;

margin-bottom:15px;

}

.box p{

line-height:1.7;

margin-bottom:20px;

color:#666;

}

button{

border:none;

padding:15px 28px;

border-radius:40px;

font-size:18px;

cursor:pointer;

font-weight:bold;

background:#4f46e5;

color:white;

transition:.25s;

}

button:hover{

transform:scale(1.05);

}

#winScreen{

display:none;

}

@media(max-width:768px){

#gameBoard{

grid-template-columns:repeat(4,70px);

gap:10px;

}

.card{

width:70px;
height:70px;

}

.front,
.back{

font-size:34px;

}

}

</style>

</head>

<body>

<div class="topBar">

<div class="stat">

<div class="label">⏱ Time</div>

<div class="value" id="timer">0</div>

</div>

<div class="stat">

<div class="label">🔄 Moves</div>

<div class="value" id="moves">0</div>

</div>

<div class="stat">

<div class="label">⭐ Matches</div>

<div class="value" id="matches">0</div>

</div>

</div>

<div id="gameBoard"></div>

<div class="screen" id="startScreen">

<div class="box">

<h1>🧠 Memory Game</h1>

<p>

Flip the cards and match all the pairs.

Try to finish with the fewest moves!

</p>

<button onclick="startGame()">

▶ Start Game

</button>

</div>

</div>

<div class="screen" id="winScreen">

<div class="box">

<h1>🎉 You Won!</h1>

<h2 id="resultText">

Congratulations!

</h2>

<br>

<button onclick="restartGame()">

🔄 Play Again

</button>

<br><br>

<button onclick="goBack()">

⬅ Back to Fun Activities

</button>

</div>

</div>

<script>
    const emojis = [
"🍎","🍎",
"🍌","🍌",
"🍇","🍇",
"🍓","🍓",
"🍍","🍍",
"🍉","🍉",
"🥝","🥝",
"🍒","🍒"
];

const board = document.getElementById("gameBoard");

const timerEl = document.getElementById("timer");
const movesEl = document.getElementById("moves");
const matchesEl = document.getElementById("matches");

let firstCard = null;
let secondCard = null;

let lockBoard = false;

let moves = 0;
let matches = 0;
let seconds = 0;

let timer;

function shuffle(array){

for(let i=array.length-1;i>0;i--){

const j=Math.floor(Math.random()*(i+1));

[array[i],array[j]]=[array[j],array[i]];

}

return array;

}

function startGame(){

document.getElementById("startScreen").style.display="none";

board.innerHTML="";

moves=0;
matches=0;
seconds=0;

updateUI();

clearInterval(timer);

timer=setInterval(()=>{

seconds++;

timerEl.textContent=seconds;

},1000);

const cards=shuffle([...emojis]);

cards.forEach(symbol=>{

const card=document.createElement("div");

card.className="card";

card.dataset.emoji=symbol;

card.innerHTML=`

<div class="front">❓</div>

<div class="back">${symbol}</div>

`;

card.addEventListener("click",flipCard);

board.appendChild(card);

});

}

function flipCard(){

if(lockBoard) return;

if(this===firstCard) return;

this.classList.add("flip");

if(!firstCard){

firstCard=this;

return;

}

secondCard=this;

moves++;

movesEl.textContent=moves;

checkMatch();

}

function checkMatch(){

if(firstCard.dataset.emoji===secondCard.dataset.emoji){

disableCards();

}

else{

unflipCards();

}

}

function disableCards(){

firstCard.removeEventListener("click",flipCard);

secondCard.removeEventListener("click",flipCard);

matches++;

matchesEl.textContent=matches;

resetTurn();

if(matches===8){

winGame();

}

}

function unflipCards(){

lockBoard=true;

setTimeout(()=>{

firstCard.classList.remove("flip");

secondCard.classList.remove("flip");

resetTurn();

},800);

}

function resetTurn(){

[firstCard,secondCard]=[null,null];

lockBoard=false;

}

function updateUI(){

timerEl.textContent=seconds;

movesEl.textContent=moves;

matchesEl.textContent=matches;

}
const bestTimeKey = "learnioMemoryBestTime";
const bestMovesKey = "learnioMemoryBestMoves";

function playSound(type){

    try{

        const ctx = new (window.AudioContext || window.webkitAudioContext)();

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        if(type==="flip"){
            osc.frequency.value = 420;
        }
        else if(type==="match"){
            osc.frequency.value = 720;
        }
        else{
            osc.frequency.value = 900;
        }

        gain.gain.value = 0.08;

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            ctx.currentTime + 0.18
        );

        osc.stop(ctx.currentTime + 0.18);

    }catch(e){}

}

const oldFlip = flipCard;

flipCard = function(){

    playSound("flip");

    oldFlip.call(this);

};

const oldDisable = disableCards;

disableCards = function(){

    playSound("match");

    oldDisable();

};

function createConfetti(){

    for(let i=0;i<80;i++){

        const confetti=document.createElement("div");

        confetti.style.position="fixed";
        confetti.style.left=Math.random()*100+"vw";
        confetti.style.top="-20px";
        confetti.style.width="8px";
        confetti.style.height="8px";
        confetti.style.borderRadius="50%";

        const colors=[
            "#ff595e",
            "#ffca3a",
            "#8ac926",
            "#1982c4",
            "#6a4c93"
        ];

        confetti.style.background=
            colors[Math.floor(Math.random()*colors.length)];

        confetti.style.transition="transform 3s linear, opacity 3s";

        document.body.appendChild(confetti);

        requestAnimationFrame(()=>{

            confetti.style.transform=
                `translateY(${window.innerHeight+80}px)
                 rotate(${Math.random()*720}deg)`;

            confetti.style.opacity="0";

        });

        setTimeout(()=>{
            confetti.remove();
        },3000);

    }

}

function winGame(){

    clearInterval(timer);

    playSound("win");

    createConfetti();

    let bestTime =
        Number(localStorage.getItem(bestTimeKey) || 0);

    let bestMoves =
        Number(localStorage.getItem(bestMovesKey) || 0);

    if(bestTime===0 || seconds<bestTime){

        bestTime=seconds;

        localStorage.setItem(bestTimeKey,bestTime);

    }

    if(bestMoves===0 || moves<bestMoves){

        bestMoves=moves;

        localStorage.setItem(bestMovesKey,bestMoves);

    }

    document.getElementById("resultText").innerHTML=`
        ⏱ Time : <b>${seconds} sec</b><br><br>
        🔄 Moves : <b>${moves}</b><br><br>
        🏆 Best Time : <b>${bestTime} sec</b><br><br>
        🥇 Best Moves : <b>${bestMoves}</b>
    `;

    document.getElementById("winScreen").style.display="flex";

}

function restartGame(){

    document.getElementById("winScreen").style.display="none";

    firstCard=null;
    secondCard=null;

    lockBoard=false;

    startGame();

}

function goBack(){

    window.location.href="../../../index.html";

}

</script>

</body>
</html>
