<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Learnio - Balloon Pop</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
    height:100vh;

    background:linear-gradient(
        to bottom,
        #7fd8ff 0%,
        #bdeeff 40%,
        #ffffff 100%
    );
}

/*=========================
    TOP BAR
=========================*/

.topBar{
    position:absolute;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    width:min(95%,900px);

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:12px 18px;

    border-radius:18px;

    background:rgba(255,255,255,.35);

    backdrop-filter:blur(15px);

    box-shadow:
    0 8px 25px rgba(0,0,0,.15);

    z-index:1000;
}

.stat{
    display:flex;
    flex-direction:column;
    align-items:center;
}

.label{
    font-size:13px;
    color:#444;
}

.value{
    font-size:24px;
    font-weight:bold;
    color:#1e3a8a;
}

/*=========================
    GAME AREA
=========================*/

#gameArea{
    position:absolute;
    inset:0;
    overflow:hidden;
}

/*=========================
    START SCREEN
=========================*/

.screen{
    position:absolute;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    z-index:2000;

    background:
    rgba(0,0,0,.25);
}

.card{

    width:min(92%,450px);

    background:white;

    border-radius:25px;

    padding:35px;

    text-align:center;

    box-shadow:
    0 20px 50px rgba(0,0,0,.25);

}

.card h1{

    font-size:40px;
    margin-bottom:15px;
    color:#ff4b6e;
}

.card p{

    color:#555;
    line-height:1.6;
    margin-bottom:22px;
}

button{

    border:none;

    cursor:pointer;

    padding:15px 28px;

    border-radius:50px;

    font-size:18px;

    font-weight:bold;

    transition:.25s;
}

button:hover{

    transform:scale(1.05);
}

.startBtn{

    background:#ff5a7a;
    color:white;
}

.secondaryBtn{

    margin-top:15px;

    background:#1f8fff;
    color:white;
}

/*=========================
    GAME OVER
=========================*/

#gameOver{

    display:none;
}

/*=========================
    BALLOON
=========================*/

.balloon{

    position:absolute;

    width:75px;
    height:95px;

    border-radius:
    50% 50% 48% 48%;

    cursor:pointer;

    box-shadow:
    inset -10px -15px rgba(0,0,0,.15);

    animation:
    floatSide 3s ease-in-out infinite;
}

.balloon::before{

    content:"";

    position:absolute;

    width:18px;
    height:18px;

    border-radius:50%;

    background:
    rgba(255,255,255,.55);

    left:18px;
    top:16px;
}

.balloon::after{

    content:"";

    position:absolute;

    width:2px;
    height:45px;

    background:#555;

    left:50%;
    bottom:-42px;
}

/*=========================
    POP EFFECT
=========================*/

.pop{

    animation:
    pop .18s forwards;
}

@keyframes pop{

0%{

transform:scale(1);
opacity:1;
}

100%{

transform:scale(1.8);
opacity:0;
}

}

@keyframes floatSide{

0%,100%{

transform:translateX(-6px);
}

50%{

transform:translateX(6px);
}

}

/*=========================
    CLOUDS
=========================*/

.cloud{

position:absolute;

background:white;

border-radius:100px;

opacity:.8;

filter:blur(.3px);

animation:cloudMove linear infinite;
}

.cloud:before{

content:"";

position:absolute;

background:white;

width:70%;

height:90%;

left:15%;

top:-20px;

border-radius:100px;
}

@keyframes cloudMove{

from{

transform:translateX(-220px);
}

to{

transform:translateX(calc(100vw + 250px));
}

}
/*=========================
    RESPONSIVE
=========================*/

@media (max-width:768px){

.topBar{

padding:10px;
}

.value{

font-size:20px;
}

.card{

padding:25px;
}

.card h1{

font-size:32px;
}

.balloon{

width:65px;
height:82px;
}

}

/*=========================
    END CSS
=========================*/
</style>
</head>

<body>

<div class="topBar">

<div class="stat">
<div class="label">⭐ Score</div>
<div class="value" id="score">0</div>
</div>

<div class="stat">
<div class="label">🏆 Best</div>
<div class="value" id="bestScore">0</div>
</div>

<div class="stat">
<div class="label">⏱ Time</div>
<div class="value" id="timer">60</div>
</div>

<div class="stat">
<div class="label">🎯 Level</div>
<div class="value" id="level">1</div>
</div>

</div>

<div id="gameArea"></div>

<!-- START SCREEN -->

<div class="screen" id="startScreen">

<div class="card">

<h1>🎈 Balloon Pop</h1>

<p>

Pop as many balloons as possible before time runs out!

<br><br>

Every 10 balloons increases your level.

Faster balloons = Higher difficulty.

</p>

<button class="startBtn" onclick="startGame()">

▶ Start Game

</button>

</div>

</div>

<!-- GAME OVER -->

<div class="screen" id="gameOver">

<div class="card">

<h1>🎉 Game Over</h1>

<h2 id="finalScore">

Score : 0

</h2>

<br>

<button class="startBtn" onclick="restartGame()">

🔄 Play Again

</button>

<br>

<button
class="secondaryBtn"
onclick="goBack()">

⬅ Back to Fun Activities

</button>

</div>

</div>

<script>

const gameArea=document.getElementById("gameArea");

const scoreEl=document.getElementById("score");

const timerEl=document.getElementById("timer");

const levelEl=document.getElementById("level");

const bestEl=document.getElementById("bestScore");

let score=0;

let level=1;

let timeLeft=60;

let balloonInterval;

let timerInterval;

let gameRunning=false;

let bestScore=
localStorage.getItem("learnioBalloonBest")||0;

bestEl.textContent=bestScore;
function randomColor(){

const colors=[
"#ff4d6d",
"#ff9f1c",
"#ffd60a",
"#06d6a0",
"#4cc9f0",
"#4361ee",
"#b5179e"
];

return colors[
Math.floor(Math.random()*colors.length)
];

}

function createCloud(){

const cloud=document.createElement("div");

cloud.className="cloud";

const size=80+Math.random()*120;

cloud.style.width=size+"px";

cloud.style.height=(size*.55)+"px";

cloud.style.left="-250px";

cloud.style.top=(Math.random()*40)+"%";

cloud.style.animationDuration=
(25+Math.random()*25)+"s";

gameArea.appendChild(cloud);

setTimeout(()=>{
cloud.remove();
},55000);

}

setInterval(createCloud,4000);

function startGame(){

document.getElementById("startScreen").style.display="none";

gameRunning=true;

score=0;

level=1;

timeLeft=60;

updateUI();

spawnLoop();

timerInterval=setInterval(()=>{

timeLeft--;

timerEl.textContent=timeLeft;

if(timeLeft<=0){

endGame();

}

},1000);

}

function spawnLoop(){

spawnBalloon();

balloonInterval=setInterval(()=>{

spawnBalloon();

},Math.max(350,900-level*50));

}

function spawnBalloon(){

if(!gameRunning) return;

const balloon=document.createElement("div");

balloon.className="balloon";

balloon.style.background=randomColor();

const size=60+Math.random()*35;

balloon.style.width=size+"px";

balloon.style.height=(size*1.25)+"px";

balloon.style.left=
Math.random()*
(window.innerWidth-size)+"px";

balloon.style.top=
(window.innerHeight+100)+"px";

gameArea.appendChild(balloon);

let y=window.innerHeight+100;

const speed=1.5+Math.random()*2+(level*.5);

function animate(){

if(!gameRunning){

balloon.remove();

return;

}

y-=speed;

balloon.style.top=y+"px";

if(y<-150){

balloon.remove();

return;

}

requestAnimationFrame(animate);

}

requestAnimationFrame(animate);

balloon.onclick=function(){

popBalloon(balloon);

};

}
function playPopSound(){

    try{

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = "triangle";
        osc.frequency.setValueAtTime(700, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(
            220,
            audioCtx.currentTime + 0.12
        );

        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            audioCtx.currentTime + 0.12
        );

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);

    }catch(e){}
}

function popBalloon(balloon){

    if(!gameRunning) return;

    playPopSound();

    balloon.classList.add("pop");

    score++;

    if(score % 10 === 0){
        level++;
    }

    updateUI();

    setTimeout(()=>{
        balloon.remove();
    },180);

}

function updateUI(){

    scoreEl.textContent = score;
    timerEl.textContent = timeLeft;
    levelEl.textContent = level;

}

function endGame(){

    gameRunning = false;

    clearInterval(balloonInterval);
    clearInterval(timerInterval);

    document
        .querySelectorAll(".balloon")
        .forEach(balloon=>balloon.remove());

    if(score > bestScore){

        bestScore = score;

        localStorage.setItem(
            "learnioBalloonBest",
            bestScore
        );

        bestEl.textContent = bestScore;

    }

    document.getElementById("finalScore").innerHTML =
        "🎈 Your Score : <b>" + score +
        "</b><br><br>🏆 Best Score : <b>" +
        bestScore + "</b>";

    document.getElementById("gameOver").style.display="flex";

}

function restartGame(){

    document.getElementById("gameOver").style.display="none";

    score = 0;
    level = 1;
    timeLeft = 60;

    updateUI();

    startGame();

}

function goBack(){

    window.location.href="../../../index.html";

}

updateUI();

</script>

</body>
</html>
