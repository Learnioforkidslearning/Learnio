<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Learnio - Fruit Catch</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Arial,Helvetica,sans-serif;
height:100vh;
overflow:hidden;

background:linear-gradient(
180deg,
#87CEEB 0%,
#BFEFFF 45%,
#E9FFE2 100%
);

}

/*==============================
TOP BAR
==============================*/

.topBar{

position:absolute;

top:15px;

left:50%;

transform:translateX(-50%);

width:min(95%,900px);

display:flex;

justify-content:space-between;

align-items:center;

padding:12px 18px;

border-radius:20px;

background:rgba(255,255,255,.35);

backdrop-filter:blur(15px);

box-shadow:0 10px 25px rgba(0,0,0,.15);

z-index:1000;

}

.stat{

text-align:center;

}

.label{

font-size:13px;

color:#555;

}

.value{

font-size:24px;

font-weight:bold;

color:#1f3c88;

}

/*==============================
GAME AREA
==============================*/

#gameArea{

position:absolute;

inset:0;

overflow:hidden;

}

/*==============================
START SCREEN
==============================*/

.screen{

position:absolute;

inset:0;

display:flex;

justify-content:center;

align-items:center;

background:rgba(0,0,0,.25);

z-index:3000;

}

.card{

width:min(92%,460px);

background:white;

border-radius:25px;

padding:35px;

text-align:center;

box-shadow:0 20px 45px rgba(0,0,0,.25);

}

.card h1{

font-size:40px;

color:#ff7043;

margin-bottom:15px;

}

.card p{

color:#666;

line-height:1.7;

margin-bottom:25px;

}

button{

border:none;

cursor:pointer;

padding:15px 28px;

border-radius:50px;

font-size:18px;

font-weight:bold;

transition:.25s;

}

button:hover{

transform:scale(1.05);

}

.startBtn{

background:#ff7043;

color:white;

}

.backBtn{

margin-top:15px;

background:#4f46e5;

color:white;

}

/*==============================
BASKET
==============================*/

#basket{

position:absolute;

bottom:20px;

left:50%;

transform:translateX(-50%);

font-size:75px;

user-select:none;

transition:left .08s linear;

z-index:100;

}

/*==============================
FRUITS
==============================*/

.fruit{

position:absolute;

font-size:48px;

user-select:none;

animation:fall linear;

}

@keyframes fall{

from{

transform:translateY(-80px);

}

to{

transform:translateY(calc(100vh + 100px));

}

}

/*==============================
GAME OVER
==============================*/

#gameOver{

display:none;

}

/*==============================
RESPONSIVE
==============================*/

@media(max-width:768px){

.value{

font-size:20px;

}

.card h1{

font-size:32px;

}

#basket{

font-size:60px;

}

.fruit{

font-size:40px;

}

}

</style>

</head>

<body>

<div class="topBar">

<div class="stat">

<div class="label">🍎 Score</div>

<div class="value" id="score">0</div>

</div>

<div class="stat">

<div class="label">❤️ Lives</div>

<div class="value" id="lives">3</div>

</div>

<div class="stat">

<div class="label">⭐ Level</div>

<div class="value" id="level">1</div>

</div>

<div class="stat">

<div class="label">🏆 Best</div>

<div class="value" id="bestScore">0</div>

</div>

</div>

<div id="gameArea">

<div id="basket">🧺</div>

</div>

<div class="screen" id="startScreen">

<div class="card">

<h1>🍎 Fruit Catch</h1>

<p>

Catch the falling fruits!

Avoid bombs.

Golden fruits give bonus points.

Don't lose all your lives!

</p>

<button class="startBtn" onclick="startGame()">

▶ Start Game

</button>

</div>

</div>

<div class="screen" id="gameOver">

<div class="card">

<h1>Game Over</h1>

<h2 id="finalScore">Score : 0</h2>

<br>

<button class="startBtn" onclick="restartGame()">

🔄 Play Again

</button>

<br>

<button class="backBtn" onclick="goBack()">

⬅ Back to Fun Activities

</button>

</div>

</div>

<script>
    const gameArea = document.getElementById("gameArea");
const basket = document.getElementById("basket");

const scoreEl = document.getElementById("score");
const livesEl = document.getElementById("lives");
const levelEl = document.getElementById("level");
const bestEl = document.getElementById("bestScore");

let score = 0;
let lives = 3;
let level = 1;

let basketX = window.innerWidth / 2;

let spawnInterval;

let gameRunning = false;

let bestScore = Number(
localStorage.getItem("learnioFruitBest") || 0
);

bestEl.textContent = bestScore;

const fruits = [
"🍎",
"🍌",
"🍓",
"🍇",
"🍍",
"🍉",
"🍒",
"🥝"
];

function updateUI(){

scoreEl.textContent = score;
livesEl.textContent = lives;
levelEl.textContent = level;

}

function startGame(){

document.getElementById("startScreen").style.display="none";

gameRunning = true;

score = 0;
lives = 3;
level = 1;

updateUI();

spawnInterval = setInterval(createObject,700);

}

function createObject(){

if(!gameRunning) return;

const item = document.createElement("div");

item.className = "fruit";

const random = Math.random();

if(random < 0.10){

item.textContent = "💣";
item.dataset.type = "bomb";

}
else if(random < 0.20){

item.textContent = "⭐";
item.dataset.type = "gold";

}
else{

item.textContent =
fruits[Math.floor(Math.random()*fruits.length)];

item.dataset.type = "fruit";

}

const left =
Math.random()*(window.innerWidth-60);

item.style.left = left+"px";

item.style.top = "-60px";

gameArea.appendChild(item);

let y = -60;

const speed = 3 + level*0.4;

function fall(){

if(!gameRunning){

item.remove();
return;

}

y += speed;

item.style.top = y+"px";

checkCollision(item);

if(y > window.innerHeight+80){

if(item.dataset.type==="fruit"){

lives--;

updateUI();

if(lives<=0){

endGame();

}

}

item.remove();

return;

}

requestAnimationFrame(fall);

}

requestAnimationFrame(fall);

}

document.addEventListener("keydown",function(e){

if(e.key==="ArrowLeft"){

basketX -= 35;

}

if(e.key==="ArrowRight"){

basketX += 35;

}

basketX = Math.max(45,
Math.min(window.innerWidth-45,basketX));

basket.style.left = basketX+"px";

});

let touchStart = 0;

document.addEventListener("touchstart",e=>{

touchStart = e.touches[0].clientX;

});

document.addEventListener("touchmove",e=>{

basketX = e.touches[0].clientX;

basket.style.left = basketX+"px";

});
function playCatchSound(type){

    try{

        const ctx = new (window.AudioContext || window.webkitAudioContext)();

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        if(type==="bomb"){
            osc.frequency.value = 140;
        }
        else if(type==="gold"){
            osc.frequency.value = 850;
        }
        else{
            osc.frequency.value = 500;
        }

        gain.gain.value = 0.12;

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            ctx.currentTime + 0.15
        );

        osc.stop(ctx.currentTime + 0.15);

    }catch(e){}

}

function checkCollision(item){

    const fruitRect = item.getBoundingClientRect();
    const basketRect = basket.getBoundingClientRect();

    if(
        fruitRect.bottom >= basketRect.top &&
        fruitRect.left < basketRect.right &&
        fruitRect.right > basketRect.left &&
        fruitRect.top < basketRect.bottom
    ){

        if(item.dataset.type==="fruit"){

            score++;

            if(score % 10 === 0){
                level++;
            }

            playCatchSound("fruit");

        }

        else if(item.dataset.type==="gold"){

            score += 5;

            playCatchSound("gold");

        }

        else if(item.dataset.type==="bomb"){

            lives--;

            playCatchSound("bomb");

            if(lives<=0){

                endGame();

            }

        }

        updateUI();

        item.remove();

    }

}

function endGame(){

    gameRunning = false;

    clearInterval(spawnInterval);

    document.querySelectorAll(".fruit").forEach(item=>item.remove());

    if(score > bestScore){

        bestScore = score;

        localStorage.setItem(
            "learnioFruitBest",
            bestScore
        );

        bestEl.textContent = bestScore;

    }

    document.getElementById("finalScore").innerHTML =
    "🍎 Score : <b>"+score+
    "</b><br><br>🏆 Best Score : <b>"+bestScore+"</b>";

    document.getElementById("gameOver").style.display="flex";

}

function restartGame(){

    document.getElementById("gameOver").style.display="none";

    score = 0;
    lives = 3;
    level = 1;

    basketX = window.innerWidth/2;

    basket.style.left = basketX+"px";

    updateUI();

    startGame();

}

function goBack(){

    window.location.href="../../../index.html";

}

updateUI();

</script>

</body>
</html>
